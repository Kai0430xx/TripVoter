<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripVoter - 旅遊景點投票與規劃平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto+Sans+TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button id="sidebar-toggle" class="md:hidden text-white focus:outline-none text-xl mr-2">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="bg-white text-indigo-600 p-2 rounded-xl shadow-inner font-bold flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-plane-departure text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">TripVoter</h1>
                    <p class="text-xs text-indigo-200">多人即時旅遊規劃與投票</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <div class="hidden sm:flex items-center space-x-2 bg-indigo-700/60 px-3 py-1.5 rounded-full text-sm border border-indigo-500/40">
                    <i class="fa-solid fa-user-circle text-indigo-200"></i>
                    <span class="text-indigo-100">身分：</span>
                    <span id="current-username-display" class="font-semibold text-white">載入中...</span>
                    <button onclick="changeUsername()" class="text-xs bg-indigo-500 hover:bg-indigo-400 text-white px-2 py-0.5 rounded transition ml-1">修改</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主體版面 -->
    <div class="flex-1 flex flex-row relative min-h-0">
        
        <!-- 手機版遮罩 -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

        <!-- 側邊欄：專案清單 (固定) -->
        <aside id="sidebar" class="fixed md:sticky top-16 inset-y-0 left-0 z-30 w-72 h-[calc(100vh-4rem)] bg-white border-r border-slate-200 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out flex-shrink-0">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 class="font-bold text-slate-700 flex items-center">
                    <i class="fa-solid fa-suitcase-rolling mr-2 text-indigo-600"></i> 旅遊專案列表
                </h2>
                <button id="sidebar-close" class="md:hidden text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- 專案列表區 -->
            <div id="project-list" class="flex-1 overflow-y-auto p-3 space-y-1.5">
                <!-- 動態生成專案 -->
            </div>

            <!-- 新增專案按鈕 -->
            <div class="p-3 border-t border-slate-100 bg-slate-50">
                <button onclick="openNewProjectModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl transition flex items-center justify-center shadow-sm text-sm">
                    <i class="fa-solid fa-plus mr-2"></i> 建立新旅遊專案
                </button>
            </div>
        </aside>

        <!-- 右側主要內容區 -->
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50 overflow-y-auto">
            <div id="main-content" class="max-w-5xl w-full mx-auto p-4 md:p-8 flex-1">
                <!-- 內容將由 JavaScript 動態填入 -->
            </div>
        </main>
    </div>

    <!-- 行程規劃 Modal -->
    <div id="itinerary-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-bold text-slate-900 flex items-center">
                    <i class="fa-solid fa-route text-indigo-600 mr-2"></i> 完整行程規劃 (時間線編輯)
                </h3>
                <button onclick="closeItineraryModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="p-6 overflow-y-auto flex-1 space-y-6">
                <!-- 新增天數表單 -->
                <div class="bg-indigo-50/60 p-4 rounded-2xl border border-indigo-100">
                    <h4 class="font-bold text-indigo-900 text-sm mb-3 flex items-center">
                        <i class="fa-solid fa-calendar-plus mr-2"></i> 新增一天行程
                    </h4>
                    <form onsubmit="addItineraryDay(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-2">
                        <div id="next-day-badge" class="sm:col-span-3 bg-indigo-600 text-white font-bold rounded-xl px-4 py-2.5 flex items-center justify-center text-sm shadow-sm">
                            Day 1
                        </div>
                        <div class="sm:col-span-4">
                            <input type="text" id="day-date-input" placeholder="日期（例如：11/23）" 
                                   class="w-full px-4 py-2.5 rounded-xl border border-indigo-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white">
                        </div>
                        <div class="sm:col-span-3">
                            <input type="text" id="day-memo-input" placeholder="備註/主題（例如：東部探索）" 
                                   class="w-full px-4 py-2.5 rounded-xl border border-indigo-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white">
                        </div>
                        <div class="sm:col-span-2">
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-3 rounded-xl transition text-sm shadow-sm flex items-center justify-center">
                                <i class="fa-solid fa-plus mr-1"></i> 新增
                            </button>
                        </div>
                    </form>
                </div>

                <!-- 每天的時間線列表容器 -->
                <div id="itinerary-days-container" class="space-y-6">
                    <!-- 動態帶入 -->
                </div>
            </div>

            <!-- 底部按鈕區 -->
            <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-between items-center">
                <button onclick="openExportModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center">
                    <i class="fa-solid fa-file-lines mr-1.5"></i> 導出純文字行程
                </button>
                <button onclick="closeItineraryModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-xl text-sm font-medium transition shadow-sm">完成與關閉</button>
            </div>
        </div>
    </div>

    <!-- 純文字導出 Modal -->
    <div id="export-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-bold text-slate-900 flex items-center">
                    <i class="fa-solid fa-clipboard text-emerald-600 mr-2"></i> 純文字行程表（可直接複製）
                </h3>
                <button onclick="closeExportModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 overflow-y-auto flex-1">
                <textarea id="export-textarea" readonly class="w-full h-80 p-4 rounded-xl border border-slate-300 font-mono text-xs bg-slate-50 text-slate-700 outline-none resize-none"></textarea>
            </div>
            <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-end space-x-2">
                <button onclick="copyExportText()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center">
                    <i class="fa-solid fa-copy mr-1.5"></i> 複製到剪貼簿
                </button>
                <button onclick="closeExportModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2 rounded-xl text-sm font-medium transition">關閉</button>
            </div>
        </div>
    </div>

    <!-- 快速加入行程選擇 Day 的 Modal -->
    <div id="quick-add-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6">
            <h3 class="text-base font-bold text-slate-900 mb-3 flex items-center">
                <i class="fa-solid fa-calendar-plus text-indigo-600 mr-2"></i> 選擇要加入哪一天
            </h3>
            <p id="quick-add-item-name" class="text-xs text-slate-500 mb-4 font-semibold text-indigo-600"></p>
            <div id="quick-add-days-list" class="space-y-2 mb-4 max-h-48 overflow-y-auto">
                <!-- 動態帶入天數按鈕 -->
            </div>
            <button onclick="closeQuickAddModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-xl text-xs font-medium transition">取消</button>
        </div>
    </div>

    <!-- 訪客輸入名字 Modal -->
    <div id="username-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 transform transition-all">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner text-xl">
                    <i class="fa-solid fa-id-card"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-900">歡迎來到 TripVoter！</h3>
                <p class="text-sm text-slate-500 mt-1">請先輸入您的名字，以便大家知道是誰做了投票與挑選。</p>
            </div>
            <form id="username-form" onsubmit="saveUsername(event)">
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">您的姓名 / 暱稱</label>
                    <input type="text" id="username-input" required placeholder="例如：王小明、Ariel" 
                           class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-slate-700">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-md shadow-indigo-200">
                    開始使用網頁
                </button>
            </form>
        </div>
    </div>

    <!-- 新增專案 Modal -->
    <div id="project-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-900 flex items-center">
                    <i class="fa-solid fa-folder-plus text-indigo-600 mr-2"></i> 建立新旅遊專案
                </h3>
                <button onclick="closeNewProjectModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="createProject(event)">
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">專案名稱</label>
                    <input type="text" id="project-name-input" required placeholder="例如：2026 濟州島自由行" 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700">
                </div>
                <div class="mb-5">
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">專案簡介 / 日期（選填）</label>
                    <input type="text" id="project-desc-input" placeholder="例如：11/23 - 11/27 五天四夜自駕遊" 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700">
                </div>
                <div class="flex space-x-3">
                    <button type="button" onclick="closeNewProjectModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl transition">取消</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition shadow-md shadow-indigo-200">建立專案</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- JavaScript 邏輯與雲端同步 -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAXDNGSijHTnGaXppDs0k_69pAtqWEmFxA",
            authDomain: "tripvoter.firebaseapp.com",
            projectId: "tripvoter",
            storageBucket: "tripvoter.firebasestorage.app",
            messagingSenderId: "151661879411",
            appId: "1:151661879411:web:ac6c488961d9a2bb734a06",
            measurementId: "G-VKV9TFWSHF"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let username = localStorage.getItem('tripvoter_username') || '';
        let currentProjectId = localStorage.getItem('tripvoter_current_project') || '';
        let currentFilter = '全部';
        let projects = [];
        let selectedItemForQuickAdd = null;

        const baseCategories = ['景點', '美食', '餐廳', '咖啡廳', '購物', '玩樂'];

        // 💡 取得當前專案所有用過的類別（包含自訂類別，並自動去除重複）
        function getAllCategories(proj) {
            let cats = [...baseCategories];
            if (proj && proj.itinerary) {
                proj.itinerary.forEach(day => {
                    if (day.slots) {
                        day.slots.forEach(slot => {
                            if (slot.category && !cats.includes(slot.category)) {
                                cats.push(slot.category);
                            }
                        });
                    }
                });
            }
            return cats;
        }

        function initFirestoreListener() {
            db.collection("tripvoter_data").doc("main").onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.projects) {
                        projects = data.projects;
                        if (!currentProjectId || !projects.find(p => p.id === currentProjectId)) {
                            if (projects.length > 0) currentProjectId = projects[0].id;
                        }
                        renderSidebar();
                        renderMainContent();
                        if (!document.getElementById('itinerary-modal').classList.contains('hidden')) {
                            renderItineraryModal();
                        }
                    }
                } else {
                    projects = [
                        {
                            id: 'proj-' + Date.now(),
                            name: '2026 濟州島五天四夜',
                            desc: '11/23 - 11/27 全程自駕遊規劃',
                            isFinished: false,
                            itinerary: [],
                            items: []
                        }
                    ];
                    currentProjectId = projects[0].id;
                    saveDataToCloud();
                }
            }, (error) => {
                console.error("雲端連線失敗：", error);
            });
        }

        function saveDataToCloud() {
            db.collection("tripvoter_data").doc("main").set({
                projects: projects
            }).catch((error) => {
                console.error("雲端儲存失敗: ", error);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkUsername();
            initFirestoreListener();

            document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
            document.getElementById('sidebar-close').addEventListener('click', toggleSidebar);
            document.getElementById('sidebar-overlay').addEventListener('click', toggleSidebar);
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function checkUsername() {
            const display = document.getElementById('current-username-display');
            if (!username) {
                document.getElementById('username-modal').classList.remove('hidden');
            } else {
                display.textContent = username;
                document.getElementById('username-modal').classList.add('hidden');
            }
        }

        function saveUsername(e) {
            e.preventDefault();
            const val = document.getElementById('username-input').value.trim();
            if (val) {
                username = val;
                localStorage.setItem('tripvoter_username', username);
                checkUsername();
                renderMainContent();
            }
        }

        function changeUsername() {
            document.getElementById('username-input').value = username;
            document.getElementById('username-modal').classList.add('hidden');
        }

        function renderSidebar() {
            const listContainer = document.getElementById('project-list');
            listContainer.innerHTML = '';

            projects.forEach(proj => {
                const isActive = proj.id === currentProjectId;
                const isFin = proj.isFinished;
                const btn = document.createElement('div');
                btn.className = `group flex items-center justify-between p-3 rounded-xl cursor-pointer transition ${isActive ? 'bg-indigo-50 text-indigo-700 font-semibold shadow-sm border border-indigo-100' : 'hover:bg-slate-100 text-slate-600'}`;
                btn.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden" onclick="switchProject('${proj.id}')">
                        <i class="fa-solid fa-map-location-dot ${isActive ? 'text-indigo-600' : 'text-slate-400'}"></i>
                        <div class="truncate">
                            <div class="text-sm truncate flex items-center">
                                ${proj.name}
                                ${isFin ? '<span class="ml-2 bg-emerald-100 text-emerald-700 text-[10px] px-1.5 py-0.5 rounded font-bold">已結案</span>' : ''}
                            </div>
                            <div class="text-xs text-slate-400 font-normal truncate">${proj.desc || '尚無描述'}</div>
                        </div>
                    </div>
                    ${projects.length > 1 ? `<button onclick="deleteProject(event, '${proj.id}')" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-600 p-1 transition"><i class="fa-solid fa-trash-can text-xs"></i></button>` : ''}
                `;
                listContainer.appendChild(btn);
            });
            localStorage.setItem('tripvoter_current_project', currentProjectId);
        }

        function switchProject(id) {
            currentProjectId = id;
            currentFilter = '全部';
            renderSidebar();
            renderMainContent();
            if (window.innerWidth < 768) {
                toggleSidebar();
            }
        }

        function openNewProjectModal() {
            document.getElementById('project-name-input').value = '';
            document.getElementById('project-desc-input').value = '';
            document.getElementById('project-modal').classList.remove('hidden');
        }

        function closeNewProjectModal() {
            document.getElementById('project-modal').classList.add('hidden');
        }

        function createProject(e) {
            e.preventDefault();
            const name = document.getElementById('project-name-input').value.trim();
            const desc = document.getElementById('project-desc-input').value.trim();
            if (!name) return;

            const newId = 'proj-' + Date.now();
            projects.push({
                id: newId,
                name: name,
                desc: desc,
                isFinished: false,
                itinerary: [],
                items: []
            });
            currentProjectId = newId;
            closeNewProjectModal();
            saveDataToCloud();
        }

        function deleteProject(e, id) {
            e.stopPropagation();
            if (confirm('確定要刪除這個旅遊專案嗎？')) {
                projects = projects.filter(p => p.id !== id);
                if (currentProjectId === id && projects.length > 0) {
                    currentProjectId = projects[0].id;
                }
                saveDataToCloud();
            }
        }

        function toggleFinishProject() {
            const currentProj = projects.find(p => p.id === currentProjectId);
            if (!currentProj) return;

            currentProj.isFinished = !currentProj.isFinished;
            saveDataToCloud();
            renderSidebar();
            renderMainContent();
        }

        // 行程規劃相關操作
        function openItineraryModal() {
            renderItineraryModal();
            document.getElementById('itinerary-modal').classList.add('hidden');
            document.getElementById('itinerary-modal').classList.remove('hidden');
        }

        function closeItineraryModal() {
            document.getElementById('itinerary-modal').classList.add('hidden');
        }

        function openExportModal() {
            const currentProj = projects.find(p => p.id === currentProjectId);
            if (!currentProj) return;

            let text = `=====================\n`;
            text += ` 旅遊專案：${currentProj.name}\n`;
            text += ` 簡介：${currentProj.desc || '無'}\n`;
            text += `=====================\n\n`;

            if (!currentProj.itinerary || currentProj.itinerary.length === 0) {
                text += `目前尚無任何行程規劃內容。\n`;
            } else {
                currentProj.itinerary.forEach(day => {
                    text += `【 ${day.title} 】\n`;
                    if (day.slots && day.slots.length > 0) {
                        day.slots.forEach(slot => {
                            const catTag = slot.category ? `[${slot.category}]` : '';
                            text += `  • ${slot.time} ${catTag} ${slot.content}\n`;
                            if (slot.notes) {
                                text += `    備註：${slot.notes}\n`;
                            }
                        });
                    } else {
                        text += `  (本日尚無安排)\n`;
                    }
                    text += `\n`;
                });
            }

            document.getElementById('export-textarea').value = text;
            document.getElementById('export-modal').classList.remove('hidden');
        }

        function closeExportModal() {
            document.getElementById('export-modal').classList.add('hidden');
        }

        function copyExportText() {
            const textarea = document.getElementById('export-textarea');
            textarea.select();
            document.execCommand('copy');
            alert('已成功複製純文字行程到剪貼簿！');
        }

        function addItineraryDay(e) {
            e.preventDefault();
            const currentProj = projects.find(p => p.id === currentProjectId);
            if (!currentProj.itinerary) currentProj.itinerary = [];

            const dayNum = currentProj.itinerary.length + 1;
            const dateVal = document.getElementById('day-date-input').value.trim();
            const memoVal = document.getElementById('day-memo-input').value.trim();

            let title = `Day ${dayNum}`;
            if (dateVal) title += ` (${dateVal})`;
            if (memoVal) title += ` - ${memoVal}`;

            currentProj.itinerary.push({
                id: 'day-' + Date.now(),
                title: title,
                slots: []
            });

            document.getElementById('day-date-input').value = '';
            document.getElementById('day-memo-input').value = '';
            saveDataToCloud();
            renderItineraryModal();
        }

        function deleteItineraryDay(dayId) {
            if (confirm('確定要刪除這天行程嗎？')) {
                const currentProj = projects.find(p => p.id === currentProjectId);
                currentProj.itinerary = currentProj.itinerary.filter(d => d.id !== dayId);
                saveDataToCloud();
                renderItineraryModal();
                renderItems();
            }
        }

        function handleCategoryChange(dayId) {
            const selectEl = document.getElementById(`category-select-${dayId}`);
            if (selectEl.value === 'ADD_NEW') {
                const newCat = prompt('請輸入自訂類別名稱：');
                if (newCat && newCat.trim() !== '') {
                    const trimmed = newCat.trim();
                    const currentProj = projects.find(p => p.id === currentProjectId);
                    let allCats = getAllCategories(currentProj);
                    if (!allCats.includes(trimmed)) {
                        // 暫時將新類別加入一個預設 slot 或是直接重繪以同步所有選單
                        // 這裡我們直接在某個地方記錄，或者透過新增一筆暫時記錄讓它被 getAllCategories 捕捉
                    }
                    // 為了立即生效，我們直接在當前畫面的所有 category dropdown 補上這個選項
                    document.querySelectorAll('[id^="category-select-"]').forEach(sel => {
                        let exists = false;
                        sel.querySelectorAll('option').forEach(opt => {
                            if (opt.value === trimmed) exists = true;
                        });
                        if (!exists) {
                            const newOpt = document.createElement('option');
                            newOpt.value = trimmed;
                            newOpt.textContent = trimmed;
                            sel.insertBefore(newOpt, sel.lastElementChild);
                        }
                    });
                    selectEl.value = trimmed;
                } else {
                    selectEl.value = '景點';
                }
            }
        }

        function updateSlotCategory(dayId, slotId, newCat) {
            if (newCat === 'ADD_NEW') {
                const customCat = prompt('請輸入自訂類別名稱：');
                if (customCat && customCat.trim() !== '') {
                    newCat = customCat.trim();
                } else {
                    renderItineraryModal();
                    return;
                }
            }

            const currentProj = projects.find(p => p.id === currentProjectId);
            const day = currentProj.itinerary.find(d => d.id === dayId);
            if (!day) return;
            const slot = day.slots.find(s => s.id === slotId);
            if (!slot) return;

            slot.category = newCat;
            saveDataToCloud();
            renderItineraryModal(); // 重新渲染以同步所有選單
        }

        function addItinerarySlot(e, dayId) {
            e.preventDefault();
            const timeInput = document.getElementById(`time-${dayId}`);
            const categorySelect = document.getElementById(`category-select-${dayId}`);
            const selectEl = document.getElementById(`select-${dayId}`);
            const inputEl = document.getElementById(`input-${dayId}`);

            const time = timeInput.value.trim();
            const category = categorySelect.value || '景點';
            let content = selectEl.value ? selectEl.value : inputEl.value.trim();

            if (!time || !content) return;

            const currentProj = projects.find(p => p.id === currentProjectId);
            const day = currentProj.itinerary.find(d => d.id === dayId);
            if (day) {
                day.slots.push({
                    id: 'slot-' + Date.now(),
                    time: time,
                    category: category,
                    content: content,
                    notes: ''
                });

                day.slots.sort((a, b) => a.time.localeCompare(b.time));

                timeInput.value = '';
                categorySelect.value = '景點';
                selectEl.value = '';
                inputEl.value = '';
                saveDataToCloud();
                renderItineraryModal();
                renderItems();
            }
        }

        function deleteItinerarySlot(dayId, slotId) {
            const currentProj = projects.find(p => p.id === currentProjectId);
            const day = currentProj.itinerary.find(d => d.id === dayId);
            if (day) {
                day.slots = day.slots.filter(s => s.id !== slotId);
                saveDataToCloud();
                renderItineraryModal();
                renderItems();
            }
        }

        function editItinerarySlot(dayId, slotId) {
            const currentProj = projects.find(p => p.id === currentProjectId);
            const day = currentProj.itinerary.find(d => d.id === dayId);
            if (!day) return;
            const slot = day.slots.find(s => s.id === slotId);
            if (!slot) return;

            const newTime = prompt('請修改時間：', slot.time);
            if (newTime === null) return;
            const newContent = prompt('請修改活動內容或地點：', slot.content);
            if (newContent === null) return;

            if (newTime.trim() && newContent.trim()) {
                slot.time = newTime.trim();
                slot.content = newContent.trim();
                day.slots.sort((a, b) => a.time.localeCompare(b.time));
                saveDataToCloud();
                renderItineraryModal();
                renderItems();
            }
        }

        function editSlotNotes(dayId, slotId) {
            const currentProj = projects.find(p => p.id === currentProjectId);
            const day = currentProj.itinerary.find(d => d.id === dayId);
            if (!day) return;
            const slot = day.slots.find(s => s.id === slotId);
            if (!slot) return;

            const newNotes = prompt('請輸入此行程的備註（例如：地址、營業時間、門票資訊等）：', slot.notes || '');
            if (newNotes !== null) {
                slot.notes = newNotes.trim();
                saveDataToCloud();
                renderItineraryModal();
            }
        }

        function openQuickAddModal(itemName) {
            const currentProj = projects.find(p => p.id === currentProjectId);
            if (!currentProj || !currentProj.itinerary || currentProj.itinerary.length === 0) {
                alert('請先點擊右上角的「行程規劃」新增至少一天行程！');
                return;
            }

            selectedItemForQuickAdd = itemName;
            document.getElementById('quick-add-item-name').textContent = `目標景點：${itemName}`;
            
            const listContainer = document.getElementById('quick-add-days-list');
            listContainer.innerHTML = '';

            currentProj.itinerary.forEach(day => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 text-slate-700 p-2.5 rounded-xl text-xs font-medium transition border border-slate-200';
                btn.innerHTML = `<i class="fa-solid fa-calendar-day mr-1.5 text-indigo-600"></i> ${day.title}`;
                btn.onclick = () => addQuickAddSlot(day.id, itemName);
                listContainer.appendChild(btn);
            });

            document.getElementById('quick-add-modal').classList.add('hidden');
            document.getElementById('quick-add-modal').classList.remove('hidden');
        }

        function closeQuickAddModal() {
            document.getElementById('quick-add-modal').classList.add('hidden');
            selectedItemForQuickAdd = null;
        }

        function addQuickAddSlot(dayId, itemName) {
            const time = prompt('請輸入預計抵達時間（例如 10:00）：', '10:00');
            if (!time) return;

            const currentProj = projects.find(p => p.id === currentProjectId);
            const day = currentProj.itinerary.find(d => d.id === dayId);
            if (day) {
                let matchedCat = '景點';
                if (currentProj.items) {
                    const found = currentProj.items.find(i => i.name === itemName);
                    if (found) matchedCat = found.category;
                }

                day.slots.push({
                    id: 'slot-' + Date.now(),
                    time: time.trim(),
                    category: matchedCat,
                    content: itemName,
                    notes: ''
                });
                day.slots.sort((a, b) => a.time.localeCompare(b.time));
                saveDataToCloud();
                closeQuickAddModal();
                renderItems(); 
                alert(`成功將「${itemName}」加入行程中！`);
            }
        }

                dayBox.innerHTML = `

                    <form onsubmit="addItinerarySlot(event, '${day.id}')" class="flex flex-col sm:flex-row gap-2 pt-2 border-t border-slate-200/60">

                               class="w-full sm:w-24 px-3 py-1.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-xs bg-white">
                        
                        <select id="category-select-${day.id}" onchange="handleCategoryChange('${day.id}')" class="w-24 px-2 py-1.5 rounded-lg border border-amber-300 bg-amber-50 focus:ring-2 focus:ring-amber-500 outline-none text-xs font-semibold text-amber-800">

                        </select>

                container.appendChild(dayBox);

        function addItem(e) {
            e.preventDefault();
            const nameInput = document.getElementById('item-name');
            const categoryInput = document.getElementById('item-category');
            const descInput = document.getElementById('item-desc');

            const name = nameInput.value.trim();
            const category = categoryInput.value;
            let desc = descInput.value.trim();

            if (!name) return;

            if (!desc) {
                desc = `推薦造訪的${category}好去處，適合安排在行程中一同體驗。`;
            }

            let imageUrl = getSmartTravelImage(category);

            const currentProj = projects.find(p => p.id === currentProjectId);
            currentProj.items.push({
                id: 'item-' + Date.now(),
                name: name,
                category: category,
                desc: desc,
                image: imageUrl,
                mapUrl: '',
                votes: { yes: [], maybe: [], no: [] }
            });

            nameInput.value = '';
            descInput.value = '';
            saveDataToCloud();
        }

        function getSmartTravelImage(category) {
            const pools = {
                '美食': [
                    'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80',
                    'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80',
                    'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=800&q=80',
                    'https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=800&q=80'
                ],
                '景點': [
                    'https://images.unsplash.com/photo-1538485399081-03af137b0b97?auto=format&fit=crop&w=800&q=80',
                    'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80',
                    'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=800&q=80',
                    'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80'
                ],
                '購物': [
                    'https://images.unsplash.com/photo-1555529771-835f59fc5efe?auto=format&fit=crop&w=800&q=80',
                    'https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800&q=80',
                    'https://images.unsplash.com/photo-1567401893414-76b7b1e5a7a5?auto=format&fit=crop&w=800&q=80'
                ]
            };
            const list = pools[category] || pools['景點'];
            return list[Math.floor(Math.random() * list.length)];
        }

        function editItemName(itemId) {
            const currentProj = projects.find(p => p.id === currentProjectId);
            const item = currentProj.items.find(i => i.id === itemId);
            if (!item) return;

            const newName = prompt('請修改項目名稱：', item.name);
            if (newName && newName.trim() !== '') {
                item.name = newName.trim();
                saveDataToCloud();
            }
        }

        function editItemImage(itemId) {
            const newUrl = prompt('請輸入這張圖片的真實網址：');
            if (newUrl && newUrl.trim() !== '') {
                const currentProj = projects.find(p => p.id === currentProjectId);
                const item = currentProj.items.find(i => i.id === itemId);
                if (item) {
                    item.image = newUrl.trim();
                    saveDataToCloud();
                }
            }
        }

        function editItemDesc(itemId) {
            const currentProj = projects.find(p => p.id === currentProjectId);
            const item = currentProj.items.find(i => i.id === itemId);
            if (!item) return;

            const newDesc = prompt('請修改此項目的簡短介紹：', item.desc || '');
            if (newDesc !== null) {
                item.desc = newDesc.trim();
                saveDataToCloud();
            }
        }

        function showFullDesc(itemId) {
            const currentProj = projects.find(p => p.id === currentProjectId);
            const item = currentProj.items.find(i => i.id === itemId);
            if (!item) return;

            alert(`【${item.name} 介紹】\n\n${item.desc || '尚無簡介說明...'}`);
        }

        function editItemMap(itemId) {
            const currentProj = projects.find(p => p.id === currentProjectId);
            const item = currentProj.items.find(i => i.id === itemId);
            if (!item) return;

            const newMapUrl = prompt('請貼上正確的地圖網址：', item.mapUrl || '');
            if (newMapUrl !== null) {
                item.mapUrl = newMapUrl.trim();
                saveDataToCloud();
            }
        }

        function showVoters(itemId, type) {
            const currentProj = projects.find(p => p.id === currentProjectId);
            const item = currentProj.items.find(i => i.id === itemId);
            if (!item) return;

            const typeNames = { yes: '👍 必去', maybe: '🤔 考慮', no: '👎 不去' };
            const names = item.votes[type];
            
            if (names.length === 0) {
                alert(`目前沒有人投「${typeNames[type]}」`);
            } else {
                alert(`【${item.name}】\n投「${typeNames[type]}」的名單：\n\n- ${names.join('\n- ')}`);
            }
        }

        function renderItems() {
            const container = document.getElementById('items-container');
            const currentProj = projects.find(p => p.id === currentProjectId);
            if (!currentProj) return;

            let filteredItems = currentProj.items;
            if (currentFilter !== '全部') {
                filteredItems = currentProj.items.filter(i => i.category === currentFilter);
            }

            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
                        <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3 text-lg">
                            <i class="fa-solid fa-folder-open"></i>
                        </div>
                        <p class="text-slate-600 font-medium">此分類目前沒有項目</p>
                        <p class="text-slate-400 text-xs mt-1">您可以從上方新增景點，或切換至其他分類查看。</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            filteredItems.forEach(item => {
                const yesCount = item.votes.yes.length;
                const maybeCount = item.votes.maybe.length;
                const noCount = item.votes.no.length;

                let isAlreadyAdded = false;
                if (currentProj.itinerary) {
                    for (const day of currentProj.itinerary) {
                        if (day.slots && day.slots.some(s => s.content === item.name)) {
                            isAlreadyAdded = true;
                            break;
                        }
                    }
                }

                const hasAnyVotes = yesCount > 0 || maybeCount > 0 || noCount > 0;
                
                let addBtnClass = 'bg-slate-100 text-slate-500 hover:bg-slate-200 font-medium';
                let addBtnText = '<i class="fa-solid fa-plus mr-1"></i> 加入行程';
                
                if (isAlreadyAdded) {
                    addBtnClass = 'bg-emerald-600 text-white shadow-md shadow-emerald-200 font-bold';
                    addBtnText = '<i class="fa-solid fa-check mr-1"></i> 已加入';
                } else if (hasAnyVotes) {
                    addBtnClass = 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-200 font-bold';
                }

                const yesClass = yesCount > 0 
                    ? 'bg-emerald-600 text-white shadow-md shadow-emerald-200 font-bold' 
                    : 'bg-emerald-50 text-emerald-700 font-medium hover:bg-emerald-100';

                const maybeClass = maybeCount > 0 
                    ? 'bg-amber-500 text-white shadow-md shadow-amber-200 font-bold' 
                    : 'bg-amber-50 text-amber-700 font-medium hover:bg-amber-100';

                const noClass = noCount > 0 
                    ? 'bg-rose-600 text-white shadow-md shadow-amber-200 font-bold' 
                    : 'bg-rose-50 text-rose-700 font-medium hover:bg-rose-100';

                const hasYes = item.votes.yes.includes(username);
                const hasMaybe = item.votes.maybe.includes(username);
                const hasNo = item.votes.no.includes(username);

                const finalMapUrl = item.mapUrl ? item.mapUrl : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name)}`;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col md:flex-row items-stretch transition hover:shadow-md relative';
                card.innerHTML = `
                    <!-- 左側固定高度圖片區 -->
                    <div class="md:w-72 h-52 flex-shrink-0 relative bg-slate-100 overflow-hidden">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=800&q=80'">
                        <span class="absolute top-3 left-3 bg-slate-900/70 backdrop-blur-md text-white text-xs font-semibold px-2.5 py-1 rounded-lg z-10">
                            ${item.category}
                        </span>
                        
                        <!-- 功能按鈕群 -->
                        <div class="absolute bottom-3 left-3 flex space-x-1.5 z-10">
                            <a href="${finalMapUrl}" target="_blank" class="bg-white/90 hover:bg-white text-slate-700 text-xs font-medium px-2.5 py-1 rounded-lg shadow transition flex items-center" title="查看地圖">
                                <i class="fa-solid fa-map-marked-alt text-indigo-600 mr-1"></i> 地圖
                            </a>
                            <button onclick="editItemMap('${item.id}')" class="bg-white/90 hover:bg-white text-slate-700 text-xs font-medium px-2 py-1 rounded-lg shadow transition flex items-center" title="設定地圖連結">
                                <i class="fa-solid fa-link text-indigo-600"></i>
                            </button>
                            <button onclick="editItemImage('${item.id}')" class="bg-white/90 hover:bg-white text-slate-700 text-xs font-medium px-2.5 py-1 rounded-lg shadow transition flex items-center" title="更換照片">
                                <i class="fa-solid fa-pen text-indigo-600 mr-1"></i> 換圖
                            </button>
                        </div>

                        <button onclick="deleteItem('${item.id}')" class="absolute top-3 right-3 bg-white/80 hover:bg-rose-600 hover:text-white text-slate-700 w-8 h-8 rounded-full flex items-center justify-center transition shadow-sm z-10" title="刪除景點">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>

                    <!-- 右側內容與投票區 -->
                    <div class="p-5 flex-1 flex flex-col justify-between h-52">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <h4 class="text-xl font-bold text-slate-900 truncate flex items-center pr-24">
                                    ${item.name}
                                    <button onclick="editItemName('${item.id}')" class="ml-2 text-slate-400 hover:text-indigo-600 text-xs p-1" title="修改標題名稱">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>
                                </h4>
                                <!-- 右上角加入行程按鈕 -->
                                <button onclick="openQuickAddModal('${item.name.replace(/'/g, "\\'")}')" class="absolute top-4 right-4 px-3.5 py-1.5 rounded-xl text-xs transition flex items-center shadow-sm ${addBtnClass}" title="快速加入行程">
                                    ${addBtnText}
                                </button>
                            </div>

                            <!-- 投票統計數量 -->
                            <div class="flex flex-wrap gap-2 text-xs mb-2">
                                <button onclick="showVoters('${item.id}', 'yes')" class="${yesClass} px-2.5 py-1 rounded-lg transition flex items-center shadow-sm" title="點擊查看誰投了想去">
                                    👍 必去 (${yesCount}) <i class="fa-solid fa-users text-[10px] ml-1.5 opacity-80"></i>
                                </button>
                                <button onclick="showVoters('${item.id}', 'maybe')" class="${maybeClass} px-2.5 py-1 rounded-lg transition flex items-center shadow-sm" title="點擊查看誰投了考慮">
                                    🤔 考慮 (${maybeCount}) <i class="fa-solid fa-users text-[10px] ml-1.5 opacity-80"></i>
                                </button>
                                <button onclick="showVoters('${item.id}', 'no')" class="${noClass} px-2.5 py-1 rounded-lg transition flex items-center shadow-sm" title="點擊查看誰投了不去">
                                    👎 不去 (${noCount}) <i class="fa-solid fa-users text-[10px] ml-1.5 opacity-80"></i>
                                </button>
                            </div>

                            <!-- 景點簡單介紹區 -->
                            <div class="bg-slate-50 border border-slate-100 rounded-xl px-3 py-1.5 text-xs text-slate-600 flex justify-between items-center group cursor-pointer hover:bg-slate-100 transition" onclick="showFullDesc('${item.id}')" title="點擊檢視完整介紹">
                                <p class="line-clamp-1 flex-1"><i class="fa-solid fa-circle-info text-indigo-500 mr-1.5"></i>${item.desc || '尚無簡介說明...'}</p>
                                <button onclick="event.stopPropagation(); editItemDesc('${item.id}')" class="text-slate-400 hover:text-indigo-600 p-1 opacity-60 group-hover:opacity-100 transition flex-shrink-0 ml-2" title="編輯介紹">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 投票按鈕群組 -->
                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between flex-wrap gap-2">
                            <span class="text-xs font-medium text-slate-400">您的投票：</span>
                            <div class="flex space-x-2">
                                <button onclick="vote('${item.id}', 'yes')" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center ${hasYes ? 'bg-emerald-600 text-white shadow-md shadow-emerald-200' : 'bg-slate-100 text-slate-600 hover:bg-emerald-50 hover:text-emerald-700'}">
                                    <i class="fa-solid fa-thumbs-up mr-1.5"></i> 想去
                                </button>
                                <button onclick="vote('${item.id}', 'maybe')" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center ${hasMaybe ? 'bg-amber-500 text-white shadow-md shadow-amber-200' : 'bg-slate-100 text-slate-600 hover:bg-amber-50 hover:text-amber-700'}">
                                    <i class="fa-solid fa-circle-question mr-1.5"></i> 考慮
                                </button>
                                <button onclick="vote('${item.id}', 'no')" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center ${hasNo ? 'bg-rose-600 text-white shadow-md shadow-amber-200' : 'bg-slate-100 text-slate-600 hover:bg-rose-50 hover:text-rose-700'}">
                                    <i class="fa-solid fa-thumbs-down mr-1.5"></i> 不去
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function vote(itemId, type) {
            if (!username) {
                checkUsername();
                return;
            }

            const currentProj = projects.find(p => p.id === currentProjectId);
            const item = currentProj.items.find(i => i.id === itemId);

            const hasAlreadyVoted = item.votes[type].includes(username);

            item.votes.yes = item.votes.yes.filter(u => u !== username);
            item.votes.maybe = item.votes.maybe.filter(u => u !== username);
            item.votes.no = item.votes.no.filter(u => u !== username);

            if (!hasAlreadyVoted) {
                item.votes[type].push(username);
            }

            saveDataToCloud();
        }

        function deleteItem(itemId) {
            if (confirm('確定要從清單移除這個景點嗎？')) {
                const currentProj = projects.find(p => p.id === currentProjectId);
                currentProj.items = currentProj.items.filter(i => i.id !== itemId);
                saveDataToCloud();
            }
        }
    </script>
</body>
</html>
